apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-helm
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # ESO 2.x の SecretStore 系 CRD はクライアントサイド apply のアノテーション上限（262144 bytes）を超えるため
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: false
      allowEmpty: false
